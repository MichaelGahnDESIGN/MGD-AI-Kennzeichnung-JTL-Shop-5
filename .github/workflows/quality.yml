name: Qualitätsprüfung

on:
  # Keine automatischen Cloud-Läufe: lokale Prüfungen sind der Release-Standard.
  # Ein manueller Lauf setzt eine gesonderte Prüfung der GitHub-Kosten voraus.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - name: Repository auschecken
        # Exakte Revision verhindert unbemerkte Änderungen über ein bewegliches Tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PHP einrichten
        # Auch Drittanbieter-Aktionen werden aus Sicherheitsgründen fest angeheftet.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Composer-Projektdatei streng validieren
        run: composer validate --strict
      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pluginmetadaten als XML parsen
        # DOMDocument gehört bereits zur eingerichteten PHP-Laufzeit. Dadurch
        # hängt die Prüfung nicht von einem zufällig vorinstallierten OS-Paket ab.
        run: >-
          php -r '$d = new DOMDocument(); exit($d->load("plugin/MGD_AI_Kennzeichnung/info.xml") ? 0 : 1);'
      - name: Tests ausführen
        run: composer test
      - name: JavaScript-Tests ausführen
        run: composer test:js
      - name: Statische Analyse ausführen
        run: composer analyse
      - name: Formatierung prüfen
        run: composer style
      - name: Reproduzierbares Installationspaket erstellen
        run: bash scripts/build-release.sh
      - name: Installationspaket prüfen
        run: unzip -t dist/MGD_AI_Kennzeichnung-1.3.7.zip
