name: Qualitätsprüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - name: Repository auschecken
        # Exakte Revision verhindert unbemerkte Änderungen über ein bewegliches Tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PHP einrichten
        # Auch Drittanbieter-Aktionen werden aus Sicherheitsgründen fest angeheftet.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Composer-Projektdatei streng validieren
        run: composer validate --strict
      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pluginmetadaten als XML parsen
        run: xmllint --noout plugin/MGD_AI_Kennzeichnung/info.xml
      - name: Tests ausführen
        run: composer test
      - name: Statische Analyse ausführen
        run: composer analyse
      - name: Formatierung prüfen
        run: composer style
      - name: Reproduzierbares Installationspaket erstellen
        run: bash scripts/build-release.sh
      - name: Installationspaket prüfen
        run: unzip -t dist/MGD_AI_Kennzeichnung-1.0.0.zip
